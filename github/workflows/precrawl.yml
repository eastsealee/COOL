name: 선상24 사전조회

on:
  schedule:
    - cron: "0 20,2,8,14 * * *"   # 한국시간 05시, 11시, 17시, 23시
  workflow_dispatch:               # Actions 탭에서 [Run workflow]로 바로 실행 가능

permissions:
  contents: write

concurrency:
  group: precrawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests beautifulsoup4 pandas streamlit

      - name: 지난번 배 목록 가져오기
        run: |
          mkdir -p out
          git fetch origin data --depth 1 || true
          git show origin/data:ss_ships.json > out/ss_ships.json 2>/dev/null || echo '{}' > out/ss_ships.json

      - name: 선상24 사전조회 실행
        run: python precrawl.py out

      - name: data 브랜치에 저장 (기록을 쌓지 않고 덮어씀)
        run: |
          cd out
          git init -q
          git config user.name "precrawl-bot"
          git config user.email "precrawl-bot@users.noreply.github.com"
          git checkout -q -b data
          git add -A
          git commit -q -m "선상24 사전조회 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
