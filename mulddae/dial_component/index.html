<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* Layout: one phone screen — app bar, day card, stats, day nav, 24h dial (calendar at 9 o'clock), tide chips, legend */
:root{
  --bg:#0f2236; --bg2:#14304b; --card:#5f7896; --card-line:#8fa6c2;
  --brown:#7a5444; --ink:#ffffff; --sub:#b9c7d8; --faint:#6f86a0;
  --tide:#ff3b3b; --sun:#ffc23d; --now:#c45cb0; --pop:#1b3a59;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);padding:4px 4px 12px}
.app{max-width:420px;margin:0 auto;background:var(--bg2);border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.bar{background:var(--brown);display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.bar .pl{display:flex;align-items:center;gap:10px;min-width:0}
.bar b{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#portBtn{flex:none;font:700 13px var(--sans);color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 11px;cursor:pointer;display:flex;align-items:center;gap:4px}
#portBtn:focus-visible,.ports button:focus-visible{outline:2px solid #ffd76a;outline-offset:1px}
.ports{position:absolute;left:8px;right:8px;top:54px;max-height:560px;display:flex;flex-direction:column;background:var(--pop);border:1px solid var(--card-line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.55);z-index:8;overflow:hidden}
.ports .top{display:flex;gap:8px;padding:10px;border-bottom:1px solid rgba(143,166,194,.3)}
.ports input{flex:1;min-width:0;font:500 15px var(--sans);color:#fff;background:#244a70;border:1px solid var(--card-line);border-radius:8px;padding:8px 10px}
.ports input::placeholder{color:#9fb3c9}
.ports .top button{font:700 13px var(--sans);color:#fff;background:rgba(255,255,255,.1);border:0;border-radius:8px;padding:0 12px;cursor:pointer}
.ports .list{overflow-y:auto;padding:4px 10px 10px}
.ports h4{margin:10px 2px 6px;font-size:12px;color:var(--sub);font-weight:700}
.ports .grp{display:flex;flex-wrap:wrap;gap:6px}
.ports .grp button{font:700 14px var(--sans);color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(143,166,194,.35);border-radius:999px;padding:6px 12px;cursor:pointer}
.ports .grp button.on{background:#d9e38a;color:#14304b;border-color:#d9e38a}
.ports .none{padding:20px;text-align:center;color:var(--sub)}
.ports .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:8px;position:sticky;top:0;background:var(--pop);padding-bottom:4px;z-index:1}
.ports .tabs button{font:900 14px var(--sans);color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(143,166,194,.35);border-radius:10px;padding:7px 0;cursor:pointer}
.ports .tabs button.on{background:#c45cb0;border-color:#c45cb0}
.ports .sgrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:6px}
.ports .sgrow span{font-size:12px;color:#d9e38a;font-weight:900;min-width:30px}
.ports button.sg{font:700 13px var(--sans);color:#dfe8f2;background:none;border:1px solid rgba(143,166,194,.35);border-radius:8px;padding:4px 9px;cursor:pointer}
.ports button.sg.on{background:#244a70;color:#fff;border-color:#9cd1ff}
.ports .grp small{font-size:11px;color:var(--sub);font-weight:500}
.ports .grp button.on small{color:#14304b}
.bar span{font-size:12px;color:#ead9cf}
.day{padding:12px 12px 8px}
.card{background:var(--card);border:1px solid var(--card-line);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;min-width:0}
.card .l{font-weight:700;font-size:16px;line-height:1.5;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.flow{display:flex;align-items:center;gap:8px}
.flow i{display:block;width:92px;height:18px;border:1px solid #c8c97c;background:rgba(40,60,90,.35)}
.flow i b{display:block;height:100%;background:#d9e38a}
#moon{grid-row:1/4;grid-column:2;width:64px;height:64px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 8px}
.stats div{background:rgba(255,255,255,.06);border-radius:10px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.stats small{font-size:11px;color:var(--sub)}
.stats strong{font-size:17px;font-variant-numeric:tabular-nums}
.nav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px;padding:0 12px}
.nav button{font:700 15px var(--sans);color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(143,166,194,.35);border-radius:10px;padding:9px 0;cursor:pointer}
.nav button.today{background:rgba(196,92,176,.28);border-color:var(--now)}
.nav button:disabled{opacity:.3;cursor:default}
.nav button:focus-visible,.cal button:focus-visible{outline:2px solid #ffd76a;outline-offset:1px}
.navinfo{text-align:center;font-size:12px;color:var(--sub);padding:5px 0 0;font-variant-numeric:tabular-nums}
.dialwrap{position:relative;padding:0 4px}
svg#dial{width:100%;height:auto;display:block;touch-action:manipulation}
svg text{font-family:var(--sans)}
.wedge{fill:transparent;cursor:pointer}
.wedge:focus,#calBtn:focus{outline:none}
.wedge:focus-visible{outline:none;stroke:#ffd76a;stroke-width:2}
#calBtn{cursor:pointer}
#calBtn:focus-visible{outline:none}
#calBtn:focus-visible rect.face{stroke:#ffd76a;stroke-width:2.5}
.cal{position:absolute;left:8px;top:8px;width:min(300px,calc(100% - 16px));background:var(--pop);border:1px solid var(--card-line);border-radius:14px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.55);z-index:5}
.cal .hd{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:15px;padding:0 2px 8px}
.cal .sels{display:flex;gap:6px}
.cal select{font:700 14px var(--sans);color:#fff;background:#244a70;border:1px solid var(--card-line);border-radius:8px;padding:4px 6px}
.cal .ft{gap:6px}.cal .ft span{flex:1}
.loading{position:absolute;inset:0;background:rgba(15,34,54,.7);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;z-index:9}
.app{position:relative}
.cal .hd button{background:none;border:0;color:#fff;font:700 18px var(--sans);width:32px;height:28px;cursor:pointer;border-radius:8px}
.cal .hd button:disabled{opacity:.25;cursor:default}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{font-size:11px;text-align:center;color:var(--sub);padding-bottom:2px}
.cal .wd:first-child{color:#ff8a8a}.cal .wd:last-child{color:#8ab8ff}
.cal .grid button{border:1px solid transparent;background:rgba(255,255,255,.06);color:#fff;border-radius:8px;padding:4px 0 3px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;font-family:var(--sans)}
.cal .grid button b{font-size:14px;line-height:1.2}
.cal .grid button small{font-size:9.5px;color:#d9e38a;font-variant-numeric:tabular-nums}
.cal .grid button.t{border-color:var(--now)}
.cal .grid button.sel{background:#d9e38a;color:#14304b}
.cal .grid button.sel small{color:#14304b}
.cal .grid button:disabled{background:none;color:rgba(255,255,255,.22);cursor:default}
.cal .grid button:disabled small{visibility:hidden}
.cal .ft{display:flex;justify-content:space-between;align-items:center;padding-top:8px;font-size:11px;color:var(--sub)}
.cal .ft button{font:700 13px var(--sans);color:#fff;background:rgba(255,255,255,.1);border:0;border-radius:8px;padding:5px 12px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 12px 10px;justify-content:center}
.chip{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.07);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.h{color:var(--tide);border:1.5px solid var(--tide)}
.chip.lw{color:var(--tide);border:1.5px dashed var(--tide)}
.chip.s{color:var(--sun);border:1.5px solid rgba(255,194,61,.6)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;padding:10px 14px 14px;border-top:1px solid rgba(143,166,194,.25);font-size:12px;color:var(--sub)}
.legend div{display:flex;align-items:center;gap:6px;min-width:0}
.legend svg{width:22px;height:22px;flex:none}
.note{font-size:11px;color:var(--faint);text-align:center;padding:0 12px 12px}
.bite{border-top:1px solid rgba(143,166,194,.25);padding:12px 12px 14px;background:#111a24}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 2px 8px}
.bhead b{font-size:16px}.bhead span{font-size:11.5px;color:var(--sub);text-align:right}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cards>div{background:rgba(255,255,255,.05);border-top:3px solid var(--c);border-radius:8px;padding:7px 9px;min-width:0}
.cards .t{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13.5px}
.cards .v{font-size:11px;padding:1px 8px;border-radius:999px;border:1.5px solid var(--vc);color:var(--vc);white-space:nowrap}
.cards .n{font-size:24px;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums}
.cards .n small{font-size:11px;color:var(--sub);font-weight:500}
.cards .w{font-size:12px;color:#dfe8f2}
#biteChart{width:100%;height:auto;display:block;margin-top:8px}
.bkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--sub);padding:4px 2px 0}
.bkey i{display:inline-block;width:16px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.bkey i.nt{height:10px;width:12px;background:rgba(0,0,0,.55);border:1px solid #2b3a4c}
.bkey i.sl{height:10px;width:8px;background:rgba(196,92,176,.45)}
.bnote{font-size:11px;color:var(--faint);margin:6px 2px 0;line-height:1.5}
</style></head><body>

<div class="app">
  <div class="loading" id="loading" hidden>물때 불러오는 중…</div>
  <div class="bar"><div class="pl"><b id="portName"></b><button id="portBtn" aria-haspopup="dialog">항구 선택 ▾</button></div><span>물때 시계</span></div>
  <div class="ports" id="ports" role="dialog" aria-label="항구 선택" hidden><div class="top"><input id="portQ" type="search" placeholder="항구·지역 검색 (예: 오천, 여수, 제주)" autocomplete="off"><button id="portClose">닫기</button></div><div class="list" id="portList"></div></div>

  <div class="day">
    <div class="card">
      <div class="l" id="dateL"></div>
      <div class="l" id="lunarL"></div>
      <div class="l flow">조류세기 <i><b id="flowBar"></b></i> <span id="flowPct"></span></div>
      <canvas id="moon" width="128" height="128"></canvas>
    </div>
  </div>
  <div class="stats">
    <div><small>수온</small><strong id="sst"></strong></div>
    <div><small>기온</small><strong id="temp"></strong></div>
    <div><small>최대 바람</small><strong id="maxWind"></strong></div>
  </div>

  <div class="nav">
    <button id="prev">◀ -1일</button>
    <button id="today" class="today">오늘</button>
    <button id="next">+1일 ▶</button>
  </div>
  <div class="navinfo" id="navinfo"></div>

  <div class="dialwrap">
    <svg id="dial" viewBox="-34 -34 468 468" role="img" aria-label="24시간 물때 시계"></svg>
    <div class="cal" id="cal" hidden></div>
  </div>


  <section class="bite" id="bite" hidden>
    <div class="bhead"><b>입질 확률</b><span id="biteSub"></span></div>
    <div class="cards" id="biteCards"></div>
    <svg id="biteChart" viewBox="0 0 400 200" role="img" aria-label="24시간 입질 확률 그래프"></svg>
    <div class="bkey"><span><i style="background:#ff8a5b"></i>주꾸미</span><span><i style="background:#9b8cff"></i>갑오징어</span><span><i class="nt"></i>야간</span><span><i class="sl"></i>고른 시간</span></div>
    <p class="bnote" id="biteNote"></p>
  </section>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gSun" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff6a0"/><stop offset=".6" stop-color="#ffcf1f"/><stop offset="1" stop-color="#f0a000"/></radialGradient>
    <linearGradient id="gCl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b9bfc8"/></linearGradient>
    <linearGradient id="gDk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aab1bb"/><stop offset="1" stop-color="#5d646e"/></linearGradient>
    <path id="cl" d="M6 19h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.4-1.6A4 4 0 0 0 6 19z"/>
    <g id="w-sun"><circle cx="12" cy="12" r="6" fill="url(#gSun)"/><g stroke="#ffcf1f" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></g>
    <g id="w-moon"><path d="M15 3a9 9 0 1 0 6 13 7.5 7.5 0 1 1-6-13z" fill="#f3e3a0"/></g>
    <g id="w-suncloud"><circle cx="9" cy="9" r="5.5" fill="url(#gSun)"/><use href="#cl" fill="url(#gCl)" transform="translate(2 1)"/></g>
    <g id="w-mooncloud"><path d="M10 2a6.5 6.5 0 1 0 4.5 9.5 5.5 5.5 0 1 1-4.5-9.5z" fill="#f3e3a0"/><use href="#cl" fill="url(#gCl)" transform="translate(2 2)"/></g>
    <g id="w-cloud"><use href="#cl" fill="url(#gCl)" transform="translate(0 -1) scale(1.05)"/></g>
    <g id="w-rain"><use href="#cl" fill="url(#gDk)" transform="translate(0 -4)"/><g stroke="#5fb0ff" stroke-width="1.8" stroke-linecap="round"><path d="M9 17l-1 3M13 17l-1 3M17 17l-1 3"/></g></g>
    <g id="w-heavy"><use href="#cl" fill="#4a515b" transform="translate(0 -5)"/><g stroke="#3a8cff" stroke-width="2.2" stroke-linecap="round"><path d="M7 15l-1.5 4.5M11 15l-1.5 4.5M15 15l-1.5 4.5M19 15l-1.5 4.5"/></g></g>
    <g id="w-snow"><use href="#cl" fill="url(#gCl)" transform="translate(0 -4)"/><g fill="#fff" stroke="#9ab" stroke-width=".8"><circle cx="9" cy="19" r="1.8"/><circle cx="13" cy="21" r="1.8"/><circle cx="17" cy="19" r="1.8"/></g></g>
    <g id="w-fog"><use href="#cl" fill="url(#gCl)" transform="translate(0 -4)"/><g stroke="#c9ced5" stroke-width="2" stroke-linecap="round"><path d="M4 18h16M7 21h10"/></g></g>
    <g id="w-wind"><g fill="none" stroke="#dfe8f2" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 13h15a3 3 0 1 1-3 3"/><path d="M3 18h7"/></g></g>
  </defs>
</svg>

<script>
(function(){
let D=null,DAYS=[],ALL=[],WX={},TODAY=-1,CENTER=0,MIN=0,MAX=0,cur=0,selH=null,lastKey=null;
const toMin=s=>{const[a,b]=s.split(":").map(Number);return a*60+b};
const dkey=k=>Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10))/864e5;
const kfmt=n=>new Date(n*864e5).toISOString().slice(0,10);
/* 서버에서 받은 자료 → 날짜별 물때. 조류세기(flow)는 서버(tide_data.add_flow)에서 선상낚시 예약조회와 같은 방식으로 계산 */
function setData(nd){
  D=nd;const dates=Object.keys(D.days).sort(),d0=dkey(dates[0]);
  DAYS=dates.map(k=>{const r=D.days[k],off=(dkey(k)-d0)*1440;
    return{date:k,lunar:r.lunar,mul:r.mul,flow:r.flow,sunrise:r.sunrise||"06:30",sunset:r.sunset||"18:00",
      tides:r.tides.map(t=>({t:t.t,h:t.h,d:t.diff,type:t.type,m:off+toMin(t.t)})),off}});
  ALL=DAYS.flatMap(d=>d.tides).sort((a,b)=>a.m-b.m);
  WX={};(D.weather||[]).forEach(w=>{(WX[w.time.slice(0,10)]??=[])[+w.time.slice(11,13)]=w});
  TODAY=dates.indexOf(D.today);
  CENTER=dates.indexOf(D.center);if(CENTER<0)CENTER=Math.max(1,dates.findIndex(k=>k>D.center));
  MIN=Math.max(1,CENTER-10);MAX=Math.min(DAYS.length-2,CENTER+10);   // 기준 날짜 앞뒤 10일
  const key=D.port+"|"+D.center;
  if(key!==lastKey){cur=CENTER;selH=null;lastKey=key}else cur=Math.min(Math.max(cur,MIN),MAX);
}

/* 물높이: 만조·간조 사이를 코사인으로 잇기 (전날·다음날 물때까지 이어서) */
function level(m){for(let i=0;i<ALL.length-1;i++){const a=ALL[i],b=ALL[i+1];if(m>=a.m&&m<=b.m){const p=(m-a.m)/(b.m-a.m);return a.h+(b.h-a.h)*(1-Math.cos(Math.PI*p))/2}}return ALL[0].h}

/* ---------- 날씨 (Open-Meteo 시간별) ---------- */
function wxInfo(c,night,ws){
  let r;
  if(c==null)r=["cloud","-"];
  else if(c===0)r=[night?"moon":"sun","맑음"];
  else if(c===1)r=[night?"mooncloud":"suncloud","구름 조금"];
  else if(c===2)r=[night?"mooncloud":"suncloud","구름 많음"];
  else if(c===3)r=["cloud","흐림"];
  else if(c===45||c===48)r=["fog","안개"];
  else if(c>=51&&c<=57)r=["rain","이슬비"];
  else if(c===61||c===63||c===66)r=["rain","비"];
  else if(c===65||c===67)r=["heavy","폭우"];
  else if(c>=71&&c<=77||c===85||c===86)r=["snow","눈"];
  else if(c===80||c===81)r=["rain","소나기"];
  else if(c===82)r=["heavy","폭우"];
  else if(c>=95)r=["heavy","뇌우"];
  else r=["cloud","흐림"];
  if(ws>=12&&!["rain","heavy","snow"].includes(r[0]))r=["wind","강풍"];
  return r}
function weather(i){const hrs=WX[DAYS[i].date];if(!hrs)return null;const out=[];
  for(let h=0;h<24;h++){const w=hrs[h];if(!w)return null;const[icon,label]=wxInfo(w.wcode,w.is_day===0,w.wspd??0);
    out.push({icon,label,temp:w.temp==null?null:Math.round(w.temp),dir:w.wdir??0,wspd:w.wspd==null?0:Math.round(w.wspd*10)/10,sst:w.sst})}
  return out}

const DIRS=["북","북북동","북동","동북동","동","동남동","남동","남남동","남","남남서","남서","서남서","서","서북서","북서","북북서"];
const WD=["일","월","화","수","목","금","토"];
const windCol=v=>v<4?"#8be08b":v<8?"#ffd84d":v<12?"#ff9a3c":"#ff4d4d";
const windWord=v=>v<4?"약함":v<8?"보통":v<12?"강함":"매우 강함";

/* ---------- 원 그리기 ---------- */
const C=200,NS="http://www.w3.org/2000/svg",svg=document.getElementById("dial");
const ang=m=>(m/1440)*2*Math.PI-Math.PI/2;
const pt=(m,r)=>[C+r*Math.cos(ang(m)),C+r*Math.sin(ang(m))];
const el=(tag,attrs,parent=svg)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e};
const txt=(x,y,s,attrs,parent)=>{const t=el("text",{x,y,"text-anchor":"middle","dominant-baseline":"central",...attrs},parent);t.textContent=s;return t};
function arc(m1,m2,r1,r2){if(m2<m1)m2+=1440;const big=(m2-m1)>720?1:0;const[a,b]=pt(m1,r2),[c,d]=pt(m2,r2),[e,f]=pt(m2,r1),[g,h]=pt(m1,r1);
  return `M${a} ${b}A${r2} ${r2} 0 ${big} 1 ${c} ${d}L${e} ${f}A${r1} ${r1} 0 ${big} 0 ${g} ${h}Z`}

function nextTide(h){const m=DAYS[cur].off+h*60;return ALL.find(t=>t.m>=m)}
function select(h){selH=h;if(typeof biteMark==="function")biteMark(h);
  sel.setAttribute("d",arc(h*60,h*60+60,80,198));const w=W?W[h]:null;
  cHour.textContent=`${h<12?"오전":"오후"} ${h%12||12}시`;cFlow.textContent=`조류세기 ${HFLOW[h]}%`;
  if(w){cIcon.setAttribute("href","#w-"+w.icon);cWx.textContent=`${w.label}${w.temp==null?"":" "+w.temp+"°"}`;
    cWind.textContent=`${DIRS[Math.round(w.dir/22.5)%16]}풍 ${w.wspd}m/s ${windWord(w.wspd)}`;cWind.setAttribute("fill",windCol(w.wspd))}
  else{cIcon.removeAttribute("href");cWx.textContent="날씨 예보 없음";cWind.textContent="";}
  const nt=nextTide(h);cTide.textContent=nt?`다음 ${nt.type==="high"?"만조":"간조"} ${nt.t}${nt.m>=DAYS[cur].off+1440?" (다음날)":""}`:"";
}

function moon(L){const c=document.getElementById("moon"),g=c.getContext("2d"),r=60,cx=64,cy=64;
  g.clearRect(0,0,128,128);g.beginPath();g.arc(cx,cy,r,0,7);g.fillStyle="#3b4556";g.fill();
  const k=Math.cos(((L-1)/29.53)*2*Math.PI),wax=L<15.5;
  g.save();g.beginPath();g.arc(cx,cy,r,0,7);g.clip();
  const lit=g.createRadialGradient(cx+12,cy-12,6,cx,cy,r);lit.addColorStop(0,"#e4e4e2");lit.addColorStop(1,"#a2a2a0");g.fillStyle=lit;
  g.beginPath();g.ellipse(cx,cy,r,r,0,-Math.PI/2,Math.PI/2,!wax);g.ellipse(cx,cy,Math.abs(k)*r,r,0,Math.PI/2,-Math.PI/2,(k>0)===wax);g.fill();
  let sd=7;const rnd=()=>(sd=(sd*9301+49297)%233280)/233280;
  for(let i=0;i<50;i++){const a=rnd()*7,dd=Math.sqrt(rnd())*r*.95,cr=r*(.03+rnd()*.1);g.beginPath();g.arc(cx+Math.cos(a)*dd,cy+Math.sin(a)*dd,cr,0,7);g.fillStyle=`rgba(60,60,60,${.08+rnd()*.15})`;g.fill()}
  g.restore()}

  const d=DAYS[cur],[y,m,dd]=d.date.split("-").map(Number),wd=WD[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];

/* ---------- 입질 확률: 라마르호 예상 조과 분석의 쭈갑물때 모델(chart24) 그대로 ----------
   하루 조차·시간별 조류 세기·물돌이 직후·일출/일몰·시즌을 점수화, 남당항(보령 대비 높이비 1.028) 선상 기준.
   라마르 블로그 기록으로 예상한 그날 오전·오후 조황(D.bite.pred)으로 ±20% 보정. 인천·경기·충남에서만 표시 */
const SEASON={jj:[0.4,0.3,0.75,0.85,0.6,0,0,0,1,1,0.8,0.55],gg:[0.2,0.2,0.35,0.6,0.75,0.7,0.55,0.7,0.9,1,0.7,0.35]};
const sig=v=>1/(1+Math.exp(-v)),gs=(v,m,sd)=>Math.exp(-((v-m)**2)/(2*sd*sd));
function biteModel(i){
  const d=DAYS[i],base=d.off,mon=+d.date.slice(5,7);
  const ext=ALL.filter(e=>e.m>=base-1440&&e.m<base+2880).map(e=>({x:(e.m-base)/60,h:e.h}));
  const rs=[];for(let k=1;k<ext.length;k++)if(ext[k].x>-3&&ext[k-1].x<27)rs.push(Math.abs(ext[k].h-ext[k-1].h));
  const dayRange=rs.length?rs.reduce((a,b)=>a+b)/rs.length:0,RR=1.028,q=dayRange/(700*RR),rRef=175*RR;
  const sr=toMin(d.sunrise)/60,ss=toMin(d.sunset)/60;
  const p=(D.bite&&D.bite.pred||{})[d.date]||{};
  const f=v=>Math.max(.8,Math.min(1.2,1+((v??50)-50)/125)),amf=f(p.am),pmf=f(p.pm);
  const jj=[],gg=[],hourly=[];
  for(let k=0;k<=144;k++){const x=k/6,m=base+k*10;
    const c=Math.abs((level(m+1)-level(m-1))*30)/rRef;
    const w=Math.max(0,...ext.map(e=>Math.exp(-(((x-e.x-.6)/1.4)**2))));
    const dl=sig((x-sr)/.35)*sig((ss-x)/.35),tw=Math.max(gs(x,sr,.7),gs(x,ss,.7)),eve=gs(x,ss+2.2,1.3),seg=x<12?amf:pmf;
    const o={};
    for(const sp of["jj","gg"]){let dp,fp,li;
      if(sp==="jj"){dp=.35+.65*gs(q,.40,.25);fp=.3+.7*gs(c,.28,.2);li=.3+.7*dl+.18*tw}
      else{dp=.4+.6*gs(q,.62,.3);fp=.3+.7*gs(c,.45,.25);li=.42+.48*dl+.2*tw+.12*eve*(1-dl)}
      const se=SEASON[sp][mon-1],raw=se*dp*fp*(.7+.4*w)*li*seg;
      o[sp]=Math.max(se?2:0,Math.min(95,Math.round(100*raw/1.12)))}
    jj.push(o.jj);gg.push(o.gg);
    if(k<144)(hourly[Math.floor(x)]??=[]).push([o.jj,o.gg,dl])}
  const hours=hourly.map((v,h)=>({H:h,jj:Math.round(v.reduce((a,b)=>a+b[0],0)/v.length),gg:Math.round(v.reduce((a,b)=>a+b[1],0)/v.length),day:v.reduce((a,b)=>a+b[2],0)/v.length}));
  const score=sp=>{const arr=hours.filter(o=>sp==="gg"||o.day>.5).map(o=>o[sp]).sort((a,b)=>b-a).slice(0,3);return arr.length?Math.round(arr.reduce((a,b)=>a+b)/arr.length):0};
  const best=sp=>{const mx=Math.max(...hours.map(o=>o[sp]));if(mx<=2)return null;const thr=Math.max(mx-8,mx*.85);let b=null,cur=null;
    for(const o of hours){if(o[sp]>=thr){cur=cur?{s:cur.s,e:o.H+1,pk:Math.max(cur.pk,o[sp])}:{s:o.H,e:o.H+1,pk:o[sp]}}
      else if(cur){if(!b||cur.pk>b.pk)b=cur;cur=null}}
    if(cur&&(!b||cur.pk>b.pk))b=cur;return b};
  return{jj,gg,hours,sc:{jj:score("jj"),gg:score("gg")},bw:{jj:best("jj"),gg:best("gg")},sr,ss,pred:p,amf,pmf}}

  bsvg.innerHTML="";const E=(t,a)=>el(t,a,bsvg),T=(x,y,s,a)=>txt(x,y,s,a,bsvg);

  [0,25,50,75,100].forEach(v=>{E("line",{x1:34,x2:390,y1:BY(v),y2:BY(v),stroke:"#2b3038","stroke-width":1});T(26,BY(v),v,{"font-size":9.5,fill:"#8a99a8","text-anchor":"end"})});

  T(BX(BM.sr),14,"일출 "+d.sunrise,{"font-size":9.5,fill:"#ffc23d"});T(BX(BM.ss),14,"일몰 "+d.sunset,{"font-size":9.5,fill:"#ffc23d"});
  E("rect",{id:"bSel",y:22,height:150,width:356/24,fill:"rgba(196,92,176,.28)"});
  sp.forEach(([k,n,c])=>{const bw=BM.bw[k];if(bw)E("rect",{x:BX(bw.s),y:22,width:BX(bw.e)-BX(bw.s),height:150,fill:c,opacity:.12})});
  sp.forEach(([k,n,c])=>{const arr=BM[k];let pts="";arr.forEach((v,i)=>{pts+=`${(BX(i/6)).toFixed(1)},${BY(v).toFixed(1)} `});
    E("polyline",{points:pts,fill:"none",stroke:c,"stroke-width":2.6,"stroke-linejoin":"round"});
    const mx=Math.max(...arr),ix=arr.indexOf(mx);if(mx>2){E("circle",{cx:BX(ix/6),cy:BY(mx),r:3.6,fill:c});T(BX(ix/6),BY(mx)-10,mx+"%",{"font-size":11,"font-weight":900,fill:c})}});
  if(cur===TODAY){const n=new Date(Date.now()+9*3600e3),h=n.getUTCHours()+n.getUTCMinutes()/60;
    E("line",{x1:BX(h),x2:BX(h),y1:22,y2:172,stroke:"#fff","stroke-dasharray":"4 3","stroke-width":1.2})}
  E("text",{x:6,y:97,"font-size":10,fill:"#8a99a8",transform:"rotate(-90 9 97)","text-anchor":"middle"}).textContent="입질 확률 %";
  document.getElementById("biteNote").textContent="쭈갑물때 모델(하루 조차·시간별 조류·물돌이 직후·일출일몰·시즌)을 남당항 선상 기준으로 계산하고, 라마르호 블로그 기록으로 예상한 그날 오전·오후 조황으로 ±20% 안에서 보정한 추정치예요. 인천·경기·충남 항구에서만 보여요.";
}

const calEl=document.getElementById("cal");let calMonth=null;
const Y0=2015,Y1=new Date().getFullYear()+1;
function toggleCal(){if(calEl.hidden){calMonth=DAYS[cur].date.slice(0,7);buildCal();calEl.hidden=false;calEl.querySelector(".grid button.sel")?.focus()}else calEl.hidden=true}
function shiftMonth(k){let[y,m]=calMonth.split("-").map(Number);m+=k;if(m<1){m=12;y--}if(m>12){m=1;y++}
  if(y<Y0||y>Y1)return;calMonth=`${y}-${String(m).padStart(2,"0")}`;buildCal()}
function pick(key){const i=DAYS.findIndex(d=>d.date===key);calEl.hidden=true;
  if(i>=MIN&&i<=MAX){cur=i;render()}else requestDate(key)}
function buildCal(){
  const [y,m]=calMonth.split("-").map(Number),first=new Date(Date.UTC(y,m-1,1)).getUTCDay(),n=new Date(Date.UTC(y,m,0)).getUTCDate();
  let yo="";for(let k=Y1;k>=Y0;k--)yo+=`<option value="${k}" ${k===y?"selected":""}>${k}년</option>`;
  let mo="";for(let k=1;k<=12;k++)mo+=`<option value="${k}" ${k===m?"selected":""}>${k}월</option>`;
  let h=`<div class="hd"><button id="cPrev" aria-label="이전 달" ${y===Y0&&m===1?"disabled":""}>‹</button>
    <span class="sels"><select id="cYear" aria-label="연도">${yo}</select><select id="cMon" aria-label="월">${mo}</select></span>
    <button id="cNext" aria-label="다음 달" ${y===Y1&&m===12?"disabled":""}>›</button></div><div class="grid">`;
  h+=WD.map(w=>`<div class="wd">${w}</div>`).join("");
  for(let i=0;i<first;i++)h+="<div></div>";
  const cd=DAYS[cur].date;
  for(let day=1;day<=n;day++){const key=`${calMonth}-${String(day).padStart(2,"0")}`,dd=DAYS.find(d=>d.date===key);
    h+=`<button data-k="${key}" class="${key===D.today?"t ":""}${key===cd?"sel":""}" aria-label="${m}월 ${day}일"><b>${day}</b><small>${dd?dd.flow+"%":"&nbsp;"}</small></button>`}
  h+=`</div><div class="ft"><span>% = 조류세기 · 다른 달은 고르면 불러옵니다</span><button id="cToday">오늘</button><button id="cClose">닫기</button></div>`;
  calEl.innerHTML=h;
  calEl.querySelectorAll(".grid button").forEach(b=>b.onclick=()=>pick(b.dataset.k));
  calEl.querySelector("#cClose").onclick=()=>{calEl.hidden=true};
  calEl.querySelector("#cToday").onclick=()=>pick(D.today);
  calEl.querySelector("#cPrev").onclick=()=>shiftMonth(-1);calEl.querySelector("#cNext").onclick=()=>shiftMonth(1);
  calEl.querySelector("#cYear").onchange=e=>{calMonth=`${e.target.value}-${calMonth.slice(5)}`;buildCal()};
  calEl.querySelector("#cMon").onchange=e=>{calMonth=`${calMonth.slice(0,4)}-${String(e.target.value).padStart(2,"0")}`;buildCal()};
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!calEl.hidden)calEl.hidden=true});

document.getElementById("prev").onclick=()=>{if(cur>MIN){cur--;render()}};
document.getElementById("next").onclick=()=>{if(cur<MAX){cur++;render()}};
document.getElementById("today").onclick=()=>{if(TODAY>=MIN&&TODAY<=MAX){cur=TODAY;selH=null;render()}else requestDate(D.today)};

/* ---------- Streamlit 연결: 범위 밖 날짜를 고르면 서버에 요청 → 새 자료로 다시 그림 ---------- */
const loadEl=document.getElementById("loading");
function send(type,data){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},data||{}),"*")}
function setHeight(){send("streamlit:setFrameHeight",{height:Math.ceil(document.documentElement.getBoundingClientRect().height)+4})}
function requestDate(k){loadEl.hidden=false;send("streamlit:setComponentValue",{value:{date:k,n:Date.now()},dataType:"json"})}
/* 항구 선택: 이름 옆 버튼 → 지역별 목록·검색 → 고르면 서버가 그 항구 물때를 불러옴 (날짜는 그대로) */
const portsEl=document.getElementById("ports"),portQ=document.getElementById("portQ");
/* D.ports: [키, 권역, 시도, 시군]. 권역 탭 → 시·군 → 항구, 검색은 전국 */
let pArea=null,pSg=null;
const AREAS=["서해","남해","동해","제주"];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pname=k=>k.replace(/\s*\(.*\)$/,"");
function portBtn(p,withSg){return `<button data-p="${esc(p[0])}" class="${p[0]===D.portFull?"on":""}">${esc(pname(p[0]))}${withSg?` <small>${esc(p[2])} ${esc(p[3])}</small>`:""}</button>`}
function buildPorts(){
  const P=D.ports||[],q=portQ.value.trim(),list=document.getElementById("portList");
  if(q){const rank=p=>{const n=pname(p[0]);return n.startsWith(q)?0:n.includes(q)?1:(p[2]+" "+p[3]).includes(q)?2:9};
    const all=P.map(p=>[rank(p),p]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),hit=all.slice(0,120);
    list.innerHTML=hit.length?`<h4>검색 결과 ${all.length}곳${all.length>120?" (앞 120곳만 표시 — 더 자세히 입력하세요)":""}</h4><div class="grp">${hit.map(p=>portBtn(p,true)).join("")}</div>`:'<div class="none">찾는 항구가 없습니다</div>';
  }else{
    const areas=AREAS.filter(a=>P.some(p=>p[1]===a));if(!areas.includes(pArea))pArea=areas[0];
    const inA=P.filter(p=>p[1]===pArea).map(p=>[p[0],p[1],p[2]||"",p[3]||"기타"]),sgs=[];inA.forEach(p=>{const k=p[2]+"|"+p[3];if(!sgs.includes(k))sgs.push(k)});
    const ORD={서해:["인천","경기","충남","전북","전남"],남해:["전남","경남","부산"],동해:["강원","경북","울산"],제주:["제주"]}[pArea]||[];
    const rk=sd=>{const i=ORD.indexOf(sd);return i<0?99:i};
    sgs.sort((a,b)=>{const[sa,ga]=a.split("|"),[sb,gb]=b.split("|");return rk(sa)-rk(sb)||ga.localeCompare(gb,"ko")});
    if(!sgs.includes(pSg))pSg=sgs[0];
    const bySido={};sgs.forEach(k=>{const[sd,sg]=k.split("|");(bySido[sd]??=[]).push(sg)});
    let h=`<div class="tabs">${areas.map(a=>`<button data-a="${a}" class="${a===pArea?"on":""}">${a}</button>`).join("")}</div><h4>시·군</h4>`;
    h+=Object.entries(bySido).map(([sd,arr])=>`<div class="sgrow">${sd?`<span>${esc(sd)}</span>`:""}${arr.map(sg=>`<button class="sg ${sd+"|"+sg===pSg?"on":""}" data-s="${esc(sd+"|"+sg)}">${esc(sg)}</button>`).join("")}</div>`).join("");
    const ps=inA.filter(p=>p[2]+"|"+p[3]===pSg);
    h+=`<h4 id="pHead">${esc(pSg.replace("|"," "))} 항구 ${ps.length}곳</h4><div class="grp">${ps.map(p=>portBtn(p,false)).join("")}</div>`;
    list.innerHTML=h;
    list.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{pArea=b.dataset.a;pSg=null;buildPorts();list.scrollTop=0});
    list.querySelectorAll("button.sg").forEach(b=>b.onclick=()=>{pSg=b.dataset.s;buildPorts();document.getElementById("pHead").scrollIntoView({block:"start"})});
  }
  list.querySelectorAll("button[data-p]").forEach(b=>b.onclick=()=>{portsEl.hidden=true;
    if(b.dataset.p!==D.portFull){loadEl.hidden=false;send("streamlit:setComponentValue",{value:{port:b.dataset.p,n:Date.now()},dataType:"json"})}})}
function openPorts(){const me=(D.ports||[]).find(p=>p[0]===D.portFull);if(me){pArea=me[1];pSg=me[2]+"|"+me[3]}}
document.getElementById("portBtn").onclick=()=>{if(portsEl.hidden){calEl.hidden=true;portQ.value="";openPorts();buildPorts();portsEl.hidden=false;portQ.focus()}else portsEl.hidden=true};
document.getElementById("portClose").onclick=()=>{portsEl.hidden=true};
portQ.oninput=buildPorts;
document.addEventListener("keydown",e=>{if(e.key==="Escape")portsEl.hidden=true});
window.addEventListener("message",e=>{const m=e.data;if(!m||m.type!=="streamlit:render")return;
  loadEl.hidden=true;const nd=m.args&&m.args.data;
  if(!nd||!nd.days||!Object.keys(nd.days).length){document.querySelector(".app").innerHTML='<div style="padding:24px">물때 자료를 불러오지 못했습니다.</div>';setHeight();return}
  setData(nd);render();setHeight()});
new ResizeObserver(setHeight).observe(document.body);
send("streamlit:componentReady",{apiVersion:1});
})();
</script>
</body></html>
