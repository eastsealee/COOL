<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Sans+KR:wght@500;600;700&display=swap">
<style>
/* Layout: one phone screen — header(항구·검색) → 오늘 카드(날짜·물때·조류세기·달) → 수치 3칸 → 날짜 이동 → 24시간 원 → 입질 확률
   Look: 밤바다 계기판 — 깊은 남색 바탕, 얇은 선, 숫자는 굵고 크게. 색은 뜻이 있는 곳에만(빨강=조석, 노랑=해, 청록=물) */
:root{
  --bg:#08131d; --app:#0d1a26; --panel:#122230; --panel2:#172a3a; --line:rgba(150,180,208,.16); --line2:rgba(150,180,208,.3);
  --ink:#eef4fa; --sub:#a3b6c8; --faint:#6f869c;
  --sea:#4cc3e6; --sun:#ffc857; --tide:#ff5b5b; --sel:#e07bd0; --gauge:#d8e78a;
  --jj:#ff8a5b; --gg:#a596ff; --pop:#132636;
  --brown:#0d1a26; --card:#122230; --card-line:var(--line2); --now:#e07bd0; --bg2:var(--app);
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --num:"IBM Plex Sans KR","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}   /* 안드로이드 크롬 글자 자동 키움 끄기: 높이가 바뀔 때마다 글자가 커졌다 작아져 화면이 들썩이던 원인 */
body{font-family:var(--sans);color:var(--ink);padding:4px 4px 12px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--sans)}
.app{container-type:inline-size;position:relative;max-width:420px;margin:0 auto;background:var(--app);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5)}

/* 머리줄 */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 14px 12px;background:linear-gradient(180deg,#142a3c,#0d1a26);border-bottom:1px solid var(--line)}
.bar .pl{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto;max-width:62%}
.bar b{font-size:clamp(17px,5.4cqw,21px);font-weight:900;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#portBtn{flex:none;font-weight:700;font-size:12.5px;color:var(--ink);background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:6px 11px;cursor:pointer;display:flex;align-items:center;gap:4px}
#portBtn:hover{border-color:var(--sea)}
.bar .hq{flex:1;min-width:0;position:relative}
/* 폰처럼 폭이 좁으면 머리줄을 두 줄로: 항구 이름+선택 버튼 / 검색 칸 — 이름이 '외…'처럼 잘리지 않게 */
@container (max-width:400px){
  .bar .pl{flex:1 1 100%;max-width:none;justify-content:space-between}
  .bar .hq{flex:1 1 100%}
  .bar b{white-space:normal;overflow:visible;line-height:1.2}
}
.bar .hq input{width:100%;font-size:13px;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:999px;padding:7px 10px 7px 30px}
.bar .hq input::placeholder{color:var(--faint)}
.bar .hq input:focus{outline:none;border-color:var(--sea);box-shadow:0 0 0 3px rgba(76,195,230,.18)}
.bar .hq svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;pointer-events:none}
.bar .hq svg *{stroke:var(--sub)}
#portBtn:focus-visible,.ports button:focus-visible,.nav button:focus-visible,.cal button:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* 항구 고르기 창 */
.ports{position:absolute;left:8px;right:8px;top:60px;max-height:560px;display:flex;flex-direction:column;background:var(--pop);border:1px solid var(--line2);border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.6);z-index:8;overflow:hidden}
.ports .top{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.ports input{flex:1;min-width:0;font-size:15px;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:10px;padding:8px 10px}
.ports input:focus{outline:none;border-color:var(--sea)}
.ports input::placeholder{color:var(--faint)}
.ports .top button{font-weight:700;font-size:13px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 12px;cursor:pointer}
.ports .list{overflow-y:auto;padding:4px 10px 12px}
.ports h4{margin:12px 2px 7px;font-size:11.5px;color:var(--sub);font-weight:700;letter-spacing:.02em}
.ports .grp{display:flex;flex-wrap:wrap;gap:6px}
.ports .grp button{font-weight:700;font-size:14px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.ports .grp button:hover{border-color:var(--sea)}
.ports .grp button.on{background:var(--sea);color:#06202b;border-color:var(--sea)}
.ports .grp small{font-size:11px;color:var(--sub);font-weight:500}
.ports .grp button.on small{color:#06202b}
.ports .none{padding:22px;text-align:center;color:var(--sub)}
.ports .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 0 6px;position:sticky;top:0;background:var(--pop);z-index:1}
.ports .tabs button{font-weight:900;font-size:14px;color:var(--sub);background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 0;cursor:pointer}
.ports .tabs button.on{color:#06202b;background:var(--sea);border-color:var(--sea)}
.ports .sgrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:6px}
.ports .sgrow span{font-size:11.5px;color:var(--sun);font-weight:900;min-width:30px}
.ports button.sg{font-weight:700;font-size:13px;color:var(--sub);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer}
.ports button.sg.on{color:var(--ink);background:var(--panel2);border-color:var(--sea)}

/* 오늘 카드 */
.day{padding:12px 12px 8px}
.card{background:linear-gradient(135deg,#183247,#122230 60%);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;min-width:0}
.card .l{white-space:nowrap;min-width:0}
#dateL{font-size:clamp(16px,4.8cqw,19px);font-weight:900;letter-spacing:-.02em}
#lunarL{font-size:13.5px;color:var(--sub);font-weight:500;display:flex;align-items:center;gap:8px}
#lunarL em{font-style:normal;font-weight:900;font-size:13px;color:#06202b;background:var(--sea);border-radius:6px;padding:1px 8px}
.flow{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;font-weight:700;color:var(--sub)}
.flow i{display:block;flex:1;max-width:150px;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.flow i b{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#8fd6a0,var(--gauge) 60%,#ffcf5a)}
#flowPct{font-family:var(--num);font-size:20px;font-weight:700;color:var(--gauge);font-variant-numeric:tabular-nums}
/* 오늘 카드 오른쪽: 쭈갑 채비계산 바로가기 (예전 달 그림 자리) */
#rigBtn{grid-row:1/4;grid-column:2;width:clamp(72px,21cqw,88px);aspect-ratio:1;border-radius:16px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;
  background:linear-gradient(160deg,#1f4a63,#163246);border:1px solid rgba(76,195,230,.45);color:var(--ink);
  box-shadow:0 0 0 0 rgba(76,195,230,.0);transition:transform .15s,box-shadow .2s}
#rigBtn:hover{box-shadow:0 0 14px rgba(76,195,230,.35)}
#rigBtn:active{transform:scale(.96)}
#rigBtn:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
#rigBtn svg{width:42px;height:42px}
#rigBtn b{font-size:11.5px;font-weight:900;line-height:1.15;text-align:center;letter-spacing:-.02em}
#rigBtn b span{color:var(--sea)}

/* 수치 3칸 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 10px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:1px}
.stats small{font-size:11px;color:var(--sub);letter-spacing:.02em}
.stats strong{font-family:var(--num);font-size:clamp(15px,4.6cqw,19px);font-weight:700;font-variant-numeric:tabular-nums}

/* 날짜 이동 (세그먼트) */
.nav{display:grid;grid-template-columns:1fr 1.25fr 1fr;margin:0 12px;padding:3px;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.nav button{font-weight:700;font-size:14.5px;color:var(--sub);background:transparent;border:0;border-radius:9px;padding:9px 0;cursor:pointer}
.nav button:hover:not(:disabled){color:var(--ink);background:rgba(255,255,255,.05)}
.nav button.today{color:var(--ink);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.nav button:disabled{opacity:.3;cursor:default}
.navinfo{display:none}   /* "오늘 · 다른 날짜는 달력에서" 안내는 숨김 */

/* 24시간 원 */
.dialwrap{position:relative;padding:0 4px}
svg#dial{width:100%;height:auto;display:block;touch-action:manipulation}
svg text{font-family:var(--sans)}
.wedge{fill:transparent;cursor:pointer}
/* 바람이 빨간색(12m/s 이상)이면 풍향 화살표·풍속 숫자를 깜빡임 */
#dial .warn{animation:windBlink .9s steps(2,jump-none) infinite;filter:drop-shadow(0 0 3px rgba(255,77,77,.9))}
@keyframes windBlink{0%{opacity:1}100%{opacity:.15}}
@media (prefers-reduced-motion:reduce){#dial .warn{animation:none}}
.wedge:focus,#calBtn:focus,#rsvBtn:focus,#radarBtn:focus,#lamarBtn:focus{outline:none}
.wedge:focus-visible{stroke:var(--sea);stroke-width:2}
#calBtn,#rsvBtn,#radarBtn,#lamarBtn{cursor:pointer}
#calBtn:focus-visible rect.face,#rsvBtn:focus-visible rect.face,#lamarBtn:focus-visible rect.face,#rigDial:focus-visible rect.face{stroke:var(--sea);stroke-width:2.5}

/* 달력 */
.cal{position:absolute;left:8px;top:8px;width:min(310px,calc(100% - 16px));background:var(--pop);border:1px solid var(--line2);border-radius:16px;padding:12px;box-shadow:0 20px 40px rgba(0,0,0,.6);z-index:5}
.cal .hd{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:15px;padding:0 2px 10px}
.cal .sels{display:flex;gap:6px}
.cal select{font-weight:700;font-size:14px;color:var(--ink);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:5px 6px}
.cal .hd button{background:none;border:0;color:var(--ink);font-size:20px;width:32px;height:30px;cursor:pointer;border-radius:8px}
.cal .hd button:hover:not(:disabled){background:rgba(255,255,255,.06)}
.cal .hd button:disabled{opacity:.25;cursor:default}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{font-size:11px;text-align:center;color:var(--faint);padding-bottom:3px}
.cal .wd:first-child{color:#ff8a8a}.cal .wd:last-child{color:#8ab8ff}
.cal .grid button{border:1px solid transparent;background:var(--panel2);color:var(--ink);border-radius:9px;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.cal .grid button:hover{border-color:var(--line2)}
.cal .grid button b{font-family:var(--num);font-size:14px;line-height:1.2;font-weight:700}
.cal .grid button small{font-size:9.5px;color:var(--gauge);font-variant-numeric:tabular-nums}
.cal .grid button.t{border-color:var(--sel)}
.cal .grid button.sel{background:var(--sea);color:#06202b}
.cal .grid button.sel small{color:#06202b}
.cal .grid button:disabled{background:none;color:rgba(255,255,255,.22);cursor:default}
.cal .ft{display:flex;gap:6px;justify-content:space-between;align-items:center;padding-top:10px;font-size:11px;color:var(--faint)}
.cal .ft span{flex:1}
.cal .ft button{font-weight:700;font-size:13px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}

.loading{position:absolute;inset:0;background:rgba(8,19,29,.72);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--ink);z-index:9}

/* 입질 확률 */
.bite{border-top:1px solid var(--line);padding:16px 12px 16px;background:linear-gradient(180deg,#0b1722,#0a141e)}
.bhead{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:0 2px 10px}
.bhead b{font-size:17px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}.bhead span{font-size:11.5px;color:var(--sub)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cards>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 11px;min-width:0;position:relative;overflow:hidden}
.cards>div::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.cards .t{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13.5px}
.cards .v{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--vc) 18%,transparent);color:var(--vc);white-space:nowrap}
.cards .n{font-family:var(--num);font-size:28px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums;line-height:1.25}
.cards .n small{font-family:var(--sans);font-size:11px;color:var(--sub);font-weight:500}
.cards .w{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:1px}.cards .w b{color:var(--ink)}
#biteChart{width:100%;height:auto;display:block;margin-top:10px}
.bkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--sub);padding:6px 2px 0}
.bkey i{display:inline-block;width:16px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.bkey i.nt{height:10px;width:12px;background:rgba(0,0,0,.55);border:1px solid #2b3a4c}
.bkey i.sl{height:10px;width:8px;background:rgba(224,123,208,.4)}
.bnote{font-size:11px;color:var(--faint);margin:8px 2px 0;line-height:1.55}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* 안드로이드 앱(물때 시계 앱) 안에서는 화면 끝까지 꽉 차게 — 카드 테두리·그림자 없이 앱처럼 */
body.inapp{padding:0}
body.inapp .app{max-width:none;border:0;border-radius:0;box-shadow:none}
body.inapp .bar{padding-top:12px}
#radarView{padding:6px 6px 4px}
.rvTop{display:flex;justify-content:space-between;gap:8px;align-items:center}
#rvBack{border:2px solid #bff1ff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:14px;font-family:inherit;color:#fff;cursor:pointer;
  background:linear-gradient(100deg,#0b5f7f 0%,#14a3cf 30%,#bff1ff 50%,#14a3cf 70%,#0b5f7f 100%);background-size:250% 100%;
  text-shadow:0 1px 3px rgba(0,40,60,.8);animation:rvShine 2.2s linear infinite,rvRing 1.6s ease-out infinite}
@keyframes rvShine{0%{background-position:100% 0}100%{background-position:-150% 0}}
@keyframes rvRing{0%{box-shadow:0 0 0 0 rgba(76,195,230,.7)}100%{box-shadow:0 0 0 12px rgba(76,195,230,0)}}
/* GPS 버튼: 켜짐 = 입체 녹색(위 하이라이트·아래 그림자·깜빡이는 불빛), 꺼짐 = 회색 */
#rvGps{display:inline-flex;align-items:center;gap:7px;border:1px solid #1d7a43;border-radius:999px;padding:8px 15px 9px;cursor:pointer;
  font-weight:900;font-size:13.5px;font-family:inherit;color:#fff;letter-spacing:.02em;text-shadow:0 1px 1px rgba(0,50,20,.7);
  background:linear-gradient(180deg,#7ef0a8 0%,#33c46c 45%,#1e9a4f 55%,#17803f 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 3px rgba(0,60,25,.45),0 4px 0 #0e5c2c,0 6px 10px rgba(0,0,0,.45),0 0 14px rgba(70,230,130,.35);
  transform:translateY(-2px);transition:transform .08s,box-shadow .08s}
#rvGps:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 2px rgba(0,60,25,.45),0 0 0 #0e5c2c,0 2px 4px rgba(0,0,0,.45)}
#rvGps i{width:9px;height:9px;border-radius:50%;background:#eaffef;box-shadow:0 0 6px #b6ffcc,0 0 2px #fff;animation:gpsLed 1.2s ease-in-out infinite}
@keyframes gpsLed{0%,100%{opacity:1}50%{opacity:.35}}
#rvGps.off{border-color:#3d4b59;color:#c4d0dc;text-shadow:none;
  background:linear-gradient(180deg,#5b6b7b 0%,#3c4a58 50%,#313d49 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -2px 3px rgba(0,0,0,.35),0 4px 0 #1f2831,0 6px 10px rgba(0,0,0,.4)}
#rvGps.off i{background:#6b7885;box-shadow:none;animation:none}
#bigRadar{width:100%;height:auto;display:block;margin-top:6px}
.rvInfo{margin-top:6px;padding:10px 12px;border-radius:12px;background:rgba(76,195,230,.07);border:1px solid rgba(76,195,230,.25);font-size:13.5px;line-height:1.6;color:#d8e4ef}
.rvInfo b{color:#ffd84d}.rvInfo .c{color:#4cc3e6;font-weight:800}.rvInfo .o{color:#ff9d4d;font-weight:800}.rvInfo small{color:#8a99a8}
@media (prefers-reduced-motion:reduce){#rvBack{animation:none}}
#nearBtn{margin-left:auto;flex:none;display:flex;align-items:center;gap:4px;font-weight:800;font-size:12px;color:#06202b;cursor:pointer;
  border:1px solid #7fe0f5;border-radius:999px;padding:5px 10px 5px 7px;
  background:linear-gradient(180deg,#9eeefc 0%,#4cc3e6 55%,#2a9fc4 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 0 #17708f,0 3px 6px rgba(0,0,0,.35);transform:translateY(-1px)}
#nearBtn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 #17708f}
#nearBtn svg{width:15px;height:15px}
#nearBtn.busy svg{animation:nearSpin 1s linear infinite}
@keyframes nearSpin{to{transform:rotate(360deg)}}
#nearBtn:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.bar .pl{justify-content:flex-start !important}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:50;max-width:88%;padding:10px 14px;border-radius:12px;
  background:rgba(8,22,34,.96);border:1px solid var(--sea);color:#e6f4fb;font-size:13.5px;font-weight:600;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.5);text-align:center}
#nearMap{padding:10px 12px 12px;background:#0b1722;border-bottom:1px solid var(--line)}
.nmTop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;font-weight:800}
.nmTop b{color:#ff5a5a}
#nmClose{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px;font-family:inherit;cursor:pointer}
#nmMap{touch-action:none;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;height:min(78vw,380px);border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:#cfe3ee}
#nmMap .leaflet-control-attribution{font-size:9px}
.nmList{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nmList button{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:999px;padding:5px 10px;font-weight:700;font-size:12.5px;font-family:inherit;cursor:pointer}
.nmList button small{color:var(--sub);font-weight:500;margin-left:3px}
.nmList button.on{background:#ff5a5a;border-color:#ff8a8a;color:#fff}
.nmList button.on small{color:#ffe1e1}
.pin{position:relative;width:26px;height:26px}
.pin i{position:absolute;left:3px;top:0;width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ff3b3b;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.pin i::after{content:"";position:absolute;left:5px;top:5px;width:6px;height:6px;border-radius:50%;background:#fff}
.pin.sm i{background:#5c8fd6;transform:rotate(-45deg) scale(.78)}
.pin.big::before{content:"";position:absolute;left:3px;top:15px;width:20px;height:10px;border-radius:50%;background:rgba(255,59,59,.45);animation:pinPulse 1.4s ease-out infinite}

<script>
(function(){
let D=null,DAYS=[],ALL=[],WX={},TODAY=-1,CENTER=0,MIN=0,MAX=0,cur=0,selH=null,lastKey=null;
const toMin=s=>{const[a,b]=s.split(":").map(Number);return a*60+b};
const dkey=k=>Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10))/864e5;
const kfmt=n=>new Date(n*864e5).toISOString().slice(0,10);
/* 서버에서 받은 자료 → 날짜별 물때. 조류세기(flow)는 서버(tide_data.add_flow)에서 선상낚시 예약조회와 같은 방식으로 계산 */
function setData(nd){
  D=nd;const dates=Object.keys(D.days).sort(),d0=dkey(dates[0]);
  DAYS=dates.map(k=>{const r=D.days[k],off=(dkey(k)-d0)*1440;
    return{date:k,lunar:r.lunar,mul:r.mul,flow:r.flow,sunrise:r.sunrise||"06:30",sunset:r.sunset||"18:00",
      tides:r.tides.map(t=>({t:t.t,h:t.h,d:t.diff,type:t.type,m:off+toMin(t.t)})),off}});
  ALL=DAYS.flatMap(d=>d.tides).sort((a,b)=>a.m-b.m);
  WX={};(D.weather||[]).forEach(w=>{(WX[w.time.slice(0,10)]??=[])[+w.time.slice(11,13)]=w});
  TODAY=dates.indexOf(D.today);
  CENTER=dates.indexOf(D.center);if(CENTER<0)CENTER=Math.max(1,dates.findIndex(k=>k>D.center));
  MIN=Math.max(1,CENTER-10);MAX=Math.min(DAYS.length-2,CENTER+10);   // 기준 날짜 앞뒤 10일
  const key=D.port+"|"+D.center;
  if(key!==lastKey){cur=CENTER;selH=null;lastKey=key}else cur=Math.min(Math.max(cur,MIN),MAX);
}

/* 물높이: 만조·간조 사이를 코사인으로 잇기 (전날·다음날 물때까지 이어서) */
function level(m){for(let i=0;i<ALL.length-1;i++){const a=ALL[i],b=ALL[i+1];if(m>=a.m&&m<=b.m){const p=(m-a.m)/(b.m-a.m);return a.h+(b.h-a.h)*(1-Math.cos(Math.PI*p))/2}}return ALL[0].h}

/* ---------- 날씨 (Open-Meteo 시간별) ---------- */
function wxInfo(c,night,ws){
  let r;
  if(c==null)r=["cloud","-"];
  else if(c===0)r=[night?"moon":"sun","맑음"];
  else if(c===1)r=[night?"mooncloud":"suncloud","구름 조금"];
  else if(c===2)r=[night?"mooncloud":"suncloud","구름 많음"];
  else if(c===3)r=["cloud","흐림"];
  else if(c===45||c===48)r=["fog","안개"];
  else if(c>=51&&c<=57)r=["rain","이슬비"];
  else if(c===61||c===63||c===66)r=["rain","비"];
  else if(c===65||c===67)r=["heavy","폭우"];
  else if(c>=71&&c<=77||c===85||c===86)r=["snow","눈"];
  else if(c===80||c===81)r=["rain","소나기"];
  else if(c===82)r=["heavy","폭우"];
  else if(c>=95)r=["heavy","뇌우"];
  else r=["cloud","흐림"];
  if(ws>=12&&!["rain","heavy","snow"].includes(r[0]))r=["wind","강풍"];
  return r}
function weather(i){const hrs=WX[DAYS[i].date];if(!hrs)return null;const out=[];
  for(let h=0;h<24;h++){const w=hrs[h];if(!w)return null;const[icon,label]=wxInfo(w.wcode,w.is_day===0,w.wspd??0);
    out.push({icon,label,temp:w.temp==null?null:Math.round(w.temp),dir:w.wdir??0,wspd:w.wspd==null?0:Math.round(w.wspd*10)/10,sst:w.sst})}
  return out}

const DIRS=["북","북북동","북동","동북동","동","동남동","남동","남남동","남","남남서","남서","서남서","서","서북서","북서","북북서"];
const WD=["일","월","화","수","목","금","토"];
const windCol=v=>v<4?"#8be08b":v<8?"#ffd84d":v<12?"#ff9a3c":"#ff4d4d";
const windWord=v=>v<4?"약함":v<8?"보통":v<12?"강함":"매우 강함";

/* ---------- 원 그리기 ---------- */
const C=200,NS="http://www.w3.org/2000/svg",svg=document.getElementById("dial");
const ang=m=>(m/1440)*2*Math.PI-Math.PI/2;
const pt=(m,r)=>[C+r*Math.cos(ang(m)),C+r*Math.sin(ang(m))];
const el=(tag,attrs,parent=svg)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e};
const txt=(x,y,s,attrs,parent)=>{const t=el("text",{x,y,"text-anchor":"middle","dominant-baseline":"central",...attrs},parent);t.textContent=s;return t};
function arc(m1,m2,r1,r2){if(m2<m1)m2+=1440;const big=(m2-m1)>720?1:0;const[a,b]=pt(m1,r2),[c,d]=pt(m2,r2),[e,f]=pt(m2,r1),[g,h]=pt(m1,r1);
  return `M${a} ${b}A${r2} ${r2} 0 ${big} 1 ${c} ${d}L${e} ${f}A${r1} ${r1} 0 ${big} 0 ${g} ${h}Z`}

let W=[],HFLOW=[],sel,cHour,cIcon,cWx,cFlow,cWind,cTide;

function draw(){
  const d=DAYS[cur],base=d.off;W=weather(cur);
  svg.innerHTML="";
  /* 시간별 조류세기: 물높이 변화 속도, 하루 평균 = 그날 조류세기 */
  const sp=[];for(let h=0;h<24;h++)sp.push(Math.abs(level(base+h*60+30)-level(base+h*60-30)));
  const avg=sp.reduce((a,b)=>a+b)/24;HFLOW=sp.map(s=>Math.min(100,Math.round(d.flow*s/avg)));

  // 바탕 (낮/밤)
  el("circle",{cx:C,cy:C,r:198,fill:"#0b1825"});   // 낮·밤 같은 바탕 (일출·일몰은 노란 점선으로만 표시)
  el("circle",{cx:C,cy:C,r:80,fill:"#0e1f2e"});
  sel=el("path",{fill:"rgba(224,123,208,.2)",stroke:"#e07bd0","stroke-width":1.4});

  // 바깥: 시간 숫자 + 눈금
  for(let h=0;h<24;h++){const[x1,y1]=pt(h*60,198),[x2,y2]=pt(h*60,h%3?192:187);
    el("line",{x1,y1,x2,y2,stroke:h%3?"#3d5468":"#8fa6c2","stroke-width":h%6?1:2});
    const[tx,ty]=pt(h*60+30,213);txt(tx,ty,h,{"font-size":h%3?11:14.5,"font-weight":h%3?500:700,fill:h%3?"#7f95ab":"#eef4fa","font-family":"IBM Plex Sans KR,Noto Sans KR,sans-serif"})}
  el("circle",{cx:C,cy:C,r:198,fill:"none",stroke:"rgba(150,180,208,.45)","stroke-width":1.2});

  // 3시간마다 기온: 굵은 시간 숫자(0·3·6…21시) 바로 바깥에
  if(W)for(let h=0;h<24;h+=3){const t=W[h].temp;if(t==null)continue;const[x,y]=pt(h*60+30,234);
    txt(x,y,t+"°",{"font-size":11,"font-weight":700,fill:"#ffcf9a","font-family":"IBM Plex Sans KR,Noto Sans KR,sans-serif"})}
  // 원 안 맨 바깥: 풍속 숫자 (m/s)
  if(W)for(let h=0;h<24;h++){const[x,y]=pt(h*60+30,180),v=W[h].wspd;
    txt(x,y,Math.round(v),{class:v>=12?"warn":"","font-size":13,"font-weight":700,fill:windCol(v),"font-family":"IBM Plex Sans KR,Noto Sans KR,sans-serif",stroke:"#0b1825","stroke-width":3,"paint-order":"stroke"})}
  // 날씨 아이콘
  if(W)for(let h=0;h<24;h++){const[x,y]=pt(h*60+30,157);el("use",{href:"#w-"+W[h].icon,x:x-11,y:y-11,width:22,height:22})}
  // 바람 방향 화살표 (부는 방향)
  if(W)for(let h=0;h<24;h++){const[x,y]=pt(h*60+30,134),v=W[h].wspd,len=6+Math.min(v,14)*.5;

/* ---------- 입질 확률: 라마르호 예상 조과 분석의 쭈갑물때 모델(chart24) 그대로 ----------
   하루 조차·시간별 조류 세기·물돌이 직후·일출/일몰·시즌을 점수화, 남당항(보령 대비 높이비 1.028) 선상 기준.
   라마르 블로그 기록으로 예상한 그날 오전·오후 조황(D.bite.pred)으로 ±20% 보정. 인천·경기·충남에서만 표시 */
const SEASON={jj:[0.4,0.3,0.75,0.85,0.6,0,0,0,1,1,0.8,0.55],gg:[0.2,0.2,0.35,0.6,0.75,0.7,0.55,0.7,0.9,1,0.7,0.35]};
const sig=v=>1/(1+Math.exp(-v)),gs=(v,m,sd)=>Math.exp(-((v-m)**2)/(2*sd*sd));
function biteModel(i){
  const d=DAYS[i],base=d.off,mon=+d.date.slice(5,7);
  const ext=ALL.filter(e=>e.m>=base-1440&&e.m<base+2880).map(e=>({x:(e.m-base)/60,h:e.h}));
  const rs=[];for(let k=1;k<ext.length;k++)if(ext[k].x>-3&&ext[k-1].x<27)rs.push(Math.abs(ext[k].h-ext[k-1].h));
  const dayRange=rs.length?rs.reduce((a,b)=>a+b)/rs.length:0,RR=1.028,q=dayRange/(700*RR),rRef=175*RR;
  const sr=toMin(d.sunrise)/60,ss=toMin(d.sunset)/60;
  const p=(D.bite&&D.bite.pred||{})[d.date]||{};
  const f=v=>Math.max(.8,Math.min(1.2,1+((v??50)-50)/125)),amf=f(p.am),pmf=f(p.pm);

    const c=Math.abs((level(m+1)-level(m-1))*30)/rRef;

    const dl=sig((x-sr)/.35)*sig((ss-x)/.35),tw=Math.max(gs(x,sr,.7),gs(x,ss,.7)),eve=gs(x,ss+2.2,1.3),seg=x<12?amf:pmf;
    const o={};
    for(const sp of["jj","gg"]){let dp,fp,li;
      if(sp==="jj"){dp=.35+.65*gs(q,.40,.25);fp=.3+.7*gs(c,.28,.2);li=.3+.7*dl+.18*tw}
      else{dp=.4+.6*gs(q,.62,.3);fp=.3+.7*gs(c,.45,.25);li=.42+.48*dl+.2*tw+.12*eve*(1-dl)}
      const se=SEASON[sp][mon-1],raw=se*dp*fp*(.7+.4*w)*li*seg;
      o[sp]=Math.max(se?2:0,Math.min(95,Math.round(100*raw/1.12)))}

    if(k<144)(hourly[Math.floor(x)]??=[]).push([o.jj,o.gg,dl])}
  const hours=hourly.map((v,h)=>({H:h,jj:Math.round(v.reduce((a,b)=>a+b[0],0)/v.length),gg:Math.round(v.reduce((a,b)=>a+b[1],0)/v.length),day:v.reduce((a,b)=>a+b[2],0)/v.length}));
  const score=sp=>{const arr=hours.filter(o=>sp==="gg"||o.day>.5).map(o=>o[sp]).sort((a,b)=>b-a).slice(0,3);return arr.length?Math.round(arr.reduce((a,b)=>a+b)/arr.length):0};

    for(const o of hours){if(o[sp]>=thr){cur=cur?{s:cur.s,e:o.H+1,pk:Math.max(cur.pk,o[sp])}:{s:o.H,e:o.H+1,pk:o[sp]}}
      else if(cur){if(!b||cur.pk>b.pk)b=cur;cur=null}}
    if(cur&&(!b||cur.pk>b.pk))b=cur;return b};
  return{jj,gg,hours,sc:{jj:score("jj"),gg:score("gg")},bw:{jj:best("jj"),gg:best("gg")},sr,ss,pred:p,amf,pmf}}

const calEl=document.getElementById("cal");let calMonth=null;

function shiftMonth(k){let[y,m]=calMonth.split("-").map(Number);m+=k;if(m<1){m=12;y--}if(m>12){m=1;y++}
  if(y<Y0||y>Y1)return;calMonth=`${y}-${String(m).padStart(2,"0")}`;buildCal()}

function buildCal(){

  let yo="";for(let k=Y1;k>=Y0;k--)yo+=`<option value="${k}" ${k===y?"selected":""}>${k}년</option>`;
  let mo="";for(let k=1;k<=12;k++)mo+=`<option value="${k}" ${k===m?"selected":""}>${k}월</option>`;
  let h=`<div class="hd"><button id="cPrev" aria-label="이전 달" ${y===Y0&&m===1?"disabled":""}>‹</button>
    <span class="sels"><select id="cYear" aria-label="연도">${yo}</select><select id="cMon" aria-label="월">${mo}</select></span>
    <button id="cNext" aria-label="다음 달" ${y===Y1&&m===12?"disabled":""}>›</button></div><div class="grid">`;
  h+=WD.map(w=>`<div class="wd">${w}</div>`).join("");
  for(let i=0;i<first;i++)h+="<div></div>";
  const cd=DAYS[cur].date;
  for(let day=1;day<=n;day++){const key=`${calMonth}-${String(day).padStart(2,"0")}`,dd=DAYS.find(d=>d.date===key);
    h+=`<button data-k="${key}" class="${key===D.today?"t ":""}${key===cd?"sel":""}" aria-label="${m}월 ${day}일"><b>${day}</b><small>${dd?dd.flow+"%":"&nbsp;"}</small></button>`}
  h+=`</div><div class="ft"><span>% = 조류세기 · 다른 달은 고르면 불러옵니다</span><button id="cToday">오늘</button><button id="cClose">닫기</button></div>`;
  calEl.innerHTML=h;
  calEl.querySelectorAll(".grid button").forEach(b=>b.onclick=()=>pick(b.dataset.k));
  calEl.querySelector("#cClose").onclick=()=>{calEl.hidden=true};
  calEl.querySelector("#cToday").onclick=()=>pick(D.today);
  calEl.querySelector("#cPrev").onclick=()=>shiftMonth(-1);calEl.querySelector("#cNext").onclick=()=>shiftMonth(1);
  calEl.querySelector("#cYear").onchange=e=>{calMonth=`${e.target.value}-${calMonth.slice(5)}`;buildCal()};

}

const portsEl=document.getElementById("ports"),portQ=document.getElementById("portQ");

let pArea=null,pSg=null;

function buildPorts(){
  const P=D.ports||[],q=portQ.value.trim(),list=document.getElementById("portList");
  if(q){const rank=p=>{const n=pname(p[0]);return n.startsWith(q)?0:n.includes(q)?1:(p[2]+" "+p[3]).includes(q)?2:9};
    const all=P.map(p=>[rank(p),p]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),hit=all.slice(0,120);
    list.innerHTML=hit.length?`<h4>검색 결과 ${all.length}곳${all.length>120?" (앞 120곳만 표시 — 더 자세히 입력하세요)":""}</h4><div class="grp">${hit.map(p=>portBtn(p,true)).join("")}</div>`:'<div class="none">찾는 항구가 없습니다</div>';
  }else{
    const areas=AREAS.filter(a=>P.some(p=>p[1]===a));if(!areas.includes(pArea))pArea=areas[0];
    const inA=P.filter(p=>p[1]===pArea).map(p=>[p[0],p[1],p[2]||"",p[3]||"기타"]),sgs=[];inA.forEach(p=>{const k=p[2]+"|"+p[3];if(!sgs.includes(k))sgs.push(k)});
    const ORD={서해:["인천","경기","충남","전북","전남"],남해:["전남","경남","부산"],동해:["강원","경북","울산"],제주:["제주"]}[pArea]||[];
    const rk=sd=>{const i=ORD.indexOf(sd);return i<0?99:i};
    sgs.sort((a,b)=>{const[sa,ga]=a.split("|"),[sb,gb]=b.split("|");return rk(sa)-rk(sb)||ga.localeCompare(gb,"ko")});
    if(!sgs.includes(pSg))pSg=sgs[0];
    const bySido={};sgs.forEach(k=>{const[sd,sg]=k.split("|");(bySido[sd]??=[]).push(sg)});
    let h=`<div class="tabs">${areas.map(a=>`<button data-a="${a}" class="${a===pArea?"on":""}">${a}</button>`).join("")}</div><h4>시·군</h4>`;
    h+=Object.entries(bySido).map(([sd,arr])=>`<div class="sgrow">${sd?`<span>${esc(sd)}</span>`:""}${arr.map(sg=>`<button class="sg ${sd+"|"+sg===pSg?"on":""}" data-s="${esc(sd+"|"+sg)}">${esc(sg)}</button>`).join("")}</div>`).join("");
    const ps=inA.filter(p=>p[2]+"|"+p[3]===pSg);
    h+=`<h4 id="pHead">${esc(pSg.replace("|"," "))} 항구 ${ps.length}곳</h4><div class="grp">${ps.map(p=>portBtn(p,false)).join("")}</div>`;
    list.innerHTML=h;

  }
  list.querySelectorAll("button[data-p]").forEach(b=>b.onclick=()=>{portsEl.hidden=true;hdrQ.value="";
    if(b.dataset.p!==D.portFull){loadEl.hidden=false;send("streamlit:setComponentValue",{value:{port:b.dataset.p,n:Date.now()},dataType:"json"})}})}

/* 내 근처: GPS로 지금 위치에서 가장 가까운 항구를 찾아 자동으로 고름 */

document.getElementById("nearBtn").onclick=()=>{const btn=document.getElementById("nearBtn");
  if(btn.classList.contains("busy"))return;

  navigator.geolocation.getCurrentPosition(pos=>{btn.classList.remove("busy");
    const la=pos.coords.latitude,lo=pos.coords.longitude,r=Math.PI/180,near=[];
    for(const p of (D.ports||[])){if(p[4]==null)continue;const x=(p[5]-lo)*r*Math.cos((p[4]+la)/2*r),y=(p[4]-la)*r;near.push({p,km:6371*Math.hypot(x,y)})}
    near.sort((a,b)=>a.km-b.km);const best=near[0];
    if(!best){toast("항구 위치 자료가 없습니다");return}
    const km=best.km<10?best.km.toFixed(1):Math.round(best.km);
    // 10km 안 항구 전부(최대 40곳), 없으면 가장 가까운 곳까지 보여줌

    toast(`가장 가까운 항구: <b>${esc(pname(best.p[0]))}</b> (${km}km) — 불러오는 중…`,4000);

      :"위치 권한이 꺼져 있습니다.<br>주소창 왼쪽 아이콘 → 권한 → 위치 허용"):"위치를 잡지 못했습니다. 잠시 후 다시 눌러 주세요",6000)},
  {enableHighAccuracy:true,timeout:15000,maximumAge:60000})};

/* 내 근처 지도: 한국 지도(OpenStreetMap)에 내 위치(파란 점)와 가까운 항구 핀. 빨간 핀 = 가장 가까운 항구 */
function pickPort(k){if(k===D.portFull)return;portsEl.hidden=true;calEl.hidden=true;loadEl.hidden=false;
  send("streamlit:setComponentValue",{value:{port:k,n:Date.now()},dataType:"json"})}
let LMAP=null,LLAY=null,NEAR=null;
let LPROM=null;
function loadLeaflet(){if(window.L)return Promise.resolve();if(LPROM)return LPROM;
  return LPROM=new Promise((ok,bad)=>{const c=document.createElement("link");c.rel="stylesheet";c.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";document.head.appendChild(c);
    const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";sc.onload=ok;sc.onerror=bad;document.head.appendChild(sc)})}
/* 바탕 지도: 브이월드(국토교통부) 키가 있으면 브이월드(섬 이름이 자세함), 없거나 안 되면 OpenStreetMap */
function addBase(){const k=D&&D.vworld,osm=()=>L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"});
  if(!k){osm().addTo(LMAP);return}
  const vw=(lay,ext)=>L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${k}/${lay}/{z}/{y}/{x}.${ext}`,{minZoom:6,maxZoom:19,attribution:"© 국토교통부 브이월드"});
  const base=vw("Base","png"),sat=L.layerGroup([vw("Satellite","jpeg"),vw("Hybrid","png")]);
  let bad=0,ok=0,ctl=null;base.on("tileload",()=>ok++);base.on("tileerror",()=>{if(++bad>=4&&!ok){bad=-1e9;LMAP.removeLayer(base);if(ctl)LMAP.removeControl(ctl);osm().addTo(LMAP);toast("브이월드 지도를 못 불러와 기본 지도로 보여줍니다 (인증키·등록 주소 확인)",5000)}});
  base.addTo(LMAP);ctl=L.control.layers({"일반 지도":base,"위성 + 이름":sat},null,{position:"topright",collapsed:false}).addTo(LMAP);
  LMAP.setMinZoom(6)}
/* 섬 이름표: islands.json(OpenStreetMap 섬·무인도 이름)을 받아, 화면에 보이는 섬에만 이름표를 붙임
   확대 10 이상 = 이름 있는 섬, 11.5 이상 = 작은 섬·무인도까지. 글자가 겹치면 뒤엣것은 뺌 */
let ISL=null,ISLAY=null,ISLON=true;window.__map=()=>LMAP;   // 확인용
function lockTouch(el){["touchstart","touchmove"].forEach(t=>el.addEventListener(t,e=>{if(t==="touchmove"||e.touches.length>1)e.preventDefault()},{passive:false}));
  el.addEventListener("wheel",e=>e.preventDefault(),{passive:false})}
function setupIslands(){ISLAY=L.layerGroup().addTo(LMAP);lockTouch(document.getElementById("nmMap"));
  fetch("islands.json").then(r=>r.ok?r.json():[]).then(a=>{ISL=a||[];drawIslands()}).catch(()=>{ISL=[]});
  LMAP.on("moveend zoomend",drawIslands);
  const C=L.Control.extend({options:{position:"bottomleft"},onAdd:()=>{const b=L.DomUtil.create("button","islBtn");b.type="button";
    b.textContent="섬 이름 켜짐";L.DomEvent.disableClickPropagation(b);
    b.onclick=()=>{ISLON=!ISLON;b.textContent=ISLON?"섬 이름 켜짐":"섬 이름 꺼짐";b.classList.toggle("off",!ISLON);drawIslands()};return b}});
  new C().addTo(LMAP)}
function drawIslands(){if(!ISLAY)return;ISLAY.clearLayers();if(!ISLON||!ISL||!ISL.length)return;
  const z=LMAP.getZoom();if(z<9.5)return;
  const bd=LMAP.getBounds().pad(0.05),c=LMAP.getCenter(),rects=[];
  const vis=ISL.filter(i=>(i[3]===1||z>=11.5)&&bd.contains([i[1],i[2]]));
  vis.sort((a,b)=>a[3]-b[3]||((a[1]-c.lat)**2+(a[2]-c.lng)**2)-((b[1]-c.lat)**2+(b[2]-c.lng)**2));
  let n=0;
  for(const i of vis){if(n>=220)break;const pt=LMAP.latLngToContainerPoint([i[1],i[2]]);
    const r=[pt.x-6,pt.y-9,pt.x+10+i[0].length*(i[3]===2?11:12.5),pt.y+9];      // 이름표가 차지하는 칸
    if(rects.some(q=>r[0]<q[2]&&q[0]<r[2]&&r[1]<q[3]&&q[1]<r[3]))continue;rects.push(r);n++;
    L.marker([i[1],i[2]],{interactive:false,keyboard:false,icon:L.divIcon({className:"",iconSize:[0,0],
      html:`<div class="isl${i[3]===2?" sm":""}"><i></i>${esc(i[0])}</div>`})}).addTo(ISLAY)}}
let MAPMODE=null,MAPTK=0,MAPPORT=null;
function withMap(fn){loadLeaflet().then(()=>{
    if(!LMAP){LMAP=L.map("nmMap",{zoomControl:true,attributionControl:true,tap:true,zoomSnap:0.25,zoomDelta:0.5}).setView([36.0,127.8],6);
      addBase();setupIslands();LLAY=L.layerGroup().addTo(LMAP)}
    LLAY.clearLayers();fn()}).catch(()=>{document.getElementById("nmMap").innerHTML='<div style="padding:20px;color:#14304b">지도를 불러오지 못했습니다 (인터넷 연결 확인)</div>'})}
const meIcon=()=>L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]});
const pinIcon=big=>L.divIcon({className:"",html:`<div class="pin ${big?"big":"sm"}"><i></i></div>`,iconSize:[26,26],iconAnchor:[13,26]});
/* '지도' 버튼: 지금 고른 항구(빨간 핀) + GPS 내 위치(파란 점), 둘 사이 거리 */
function showPortMap(){MAPMODE="port";MAPPORT=D.portFull;NEAR=null;const box=document.getElementById("nearMap");box.hidden=false;document.getElementById("nmList").innerHTML="";

  withMap(()=>{L.marker(pp,{icon:pinIcon(true),zIndexOffset:1000}).addTo(LLAY).bindTooltip(nm,{permanent:true,direction:"top",offset:[0,-24],className:"pinLbl"});
    const tk=++MAPTK;setTimeout(()=>{if(tk!==MAPTK)return;LMAP.invalidateSize();LMAP.fitBounds([[33.0,124.6],[38.7,130.0]],{animate:false});setTimeout(()=>{if(tk===MAPTK)LMAP.flyTo(pp,11,{duration:1.6})},600)},60)});
  if(!navigator.geolocation){title.innerHTML=`<b>${nm}</b> 위치 · 이 기기는 내 위치를 지원하지 않습니다`;return}

      L.marker([la,lo],{icon:meIcon(),zIndexOffset:500}).addTo(LLAY).bindTooltip("내 위치",{permanent:true,direction:"bottom",offset:[0,10],className:"pinLbl"});
      L.circle([la,lo],{radius:Math.min(pos.coords.accuracy||30,2000),color:"#1a73e8",weight:1,fillOpacity:.12}).addTo(LLAY);
      L.polyline([[la,lo],pp],{color:"#ff3b3b",weight:2.5,dashArray:"6 6"}).addTo(LLAY);
      const tk=++MAPTK;LMAP.stop();LMAP.invalidateSize();setTimeout(()=>{if(tk===MAPTK){LMAP.stop();LMAP.flyToBounds([[la,lo],pp],{padding:[44,44],maxZoom:14,duration:1.4})}},80)})},
  e=>{if(MAPMODE!=="port")return;title.innerHTML=`<b>${nm}</b> 위치 · `+(e.code===1?"위치 권한이 꺼져 있어 내 위치는 못 보여줍니다":"내 위치를 잡지 못했습니다")},
  {enableHighAccuracy:true,timeout:15000,maximumAge:30000})}

  if(!box.hidden&&MAPMODE==="port"){box.hidden=true;MAPMODE=null;setHeight();return}portsEl.hidden=true;calEl.hidden=true;showPortMap()};
function showNearMap(la,lo,list){MAPMODE='near';NEAR={la,lo,list};const box=document.getElementById("nearMap");box.hidden=false;
  const b=list[0],kmS=k=>k<10?k.toFixed(1):Math.round(k);
  document.getElementById("nmTitle").innerHTML=`가장 가까운 <b>${esc(pname(b.p[0]))}</b> ${kmS(b.km)}km · 10km 안 항구 ${list.filter(o=>o.km<=10).length}곳`;
  nmListUI();setHeight();
  loadLeaflet().then(()=>{
    if(!LMAP){LMAP=L.map("nmMap",{zoomControl:true,attributionControl:true,tap:true,zoomSnap:0.25,zoomDelta:0.5}).setView([36.0,127.8],6);
      addBase();setupIslands();LLAY=L.layerGroup().addTo(LMAP)}
    LLAY.clearLayers();
    L.marker([la,lo],{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:500}).addTo(LLAY).bindTooltip("내 위치",{direction:"bottom",offset:[0,8]});
    list.forEach((o,i)=>{const big=i===0;
      const m=L.marker([o.p[4],o.p[5]],{icon:L.divIcon({className:"",html:`<div class="pin ${big?"big":"sm"}"><i></i></div>`,iconSize:[26,26],iconAnchor:[13,26]}),zIndexOffset:big?1000:0}).addTo(LLAY);
      m.bindTooltip(`${esc(pname(o.p[0]))} ${kmS(o.km)}km`,{permanent:big,direction:"top",offset:[0,-24],className:"pinLbl"});
      m.on("click",()=>pickPort(o.p[0]))});
    L.polyline([[la,lo],[b.p[4],b.p[5]]],{color:"#ff3b3b",weight:2.5,dashArray:"6 6"}).addTo(LLAY);
    // 내 위치 중심 반경 10km 원 + 화면도 그 원이 꽉 차게 (가장 가까운 항구가 10km 밖이면 그 항구까지 보이게)
    const ring=L.circle([la,lo],{radius:10000,color:"#4cc3e6",weight:2,dashArray:"8 6",fill:true,fillColor:"#4cc3e6",fillOpacity:.06,interactive:false}).addTo(LLAY);
    L.marker([la+10000/111320,lo],{icon:L.divIcon({className:"",html:'<div class="ringLbl">10km</div>',iconSize:[40,16],iconAnchor:[20,8]}),interactive:false}).addTo(LLAY);
    const rb=ring.getBounds();const pts=b.km>10?[rb.getSouthWest(),rb.getNorthEast(),[b.p[4],b.p[5]]]:[rb.getSouthWest(),rb.getNorthEast()];
    // 먼저 한국 전체를 보여주고, 내 위치·가까운 항구로 날아가듯 확대
    const tk=++MAPTK;LMAP.stop();setTimeout(()=>{if(tk!==MAPTK)return;LMAP.invalidateSize();LMAP.fitBounds([[33.0,124.6],[38.7,130.0]],{animate:false});
      setTimeout(()=>{if(tk===MAPTK)LMAP.flyToBounds(pts,{padding:[14,14],maxZoom:14,duration:1.8})},700)},60);
  }).catch(()=>{document.getElementById("nmMap").innerHTML='<div style="padding:20px;color:#14304b">지도를 불러오지 못했습니다 (인터넷 연결 확인)</div>'})}
function nmListUI(){if(!NEAR)return;const kmS=k=>k<10?k.toFixed(1):Math.round(k);const el_=document.getElementById("nmList");
  el_.innerHTML=NEAR.list.map(o=>`<button data-p="${esc(o.p[0])}" class="${o.p[0]===D.portFull?"on":""}">${esc(pname(o.p[0]))}<small>${kmS(o.km)}km</small></button>`).join("");
  el_.querySelectorAll("button").forEach(b=>b.onclick=()=>pickPort(b.dataset.p))}
document.getElementById("nmClose").onclick=()=>{document.getElementById("nearMap").hidden=true;MAPMODE=null;setHeight()};
function openPorts(){const me=(D.ports||[]).find(p=>p[0]===D.portFull);if(me){pArea=me[1];pSg=me[2]+"|"+me[3]}}
const placePorts=()=>{portsEl.style.top=(document.querySelector(".bar").offsetHeight+6)+"px"};
document.getElementById("portBtn").onclick=()=>{placePorts();if(portsEl.hidden){calEl.hidden=true;portQ.value="";openPorts();buildPorts();portsEl.hidden=false;portQ.focus()}else portsEl.hidden=true};
document.getElementById("portClose").onclick=()=>{portsEl.hidden=true};
portQ.oninput=buildPorts;
/* 머리줄 검색 칸: 입력하면 항구 목록이 검색 결과로 열리고, Enter면 첫 번째 결과로 이동 */
const hdrQ=document.getElementById("hdrQ");
hdrQ.oninput=()=>{const v=hdrQ.value.trim();if(!v){portsEl.hidden=true;return}
  calEl.hidden=true;placePorts();portQ.value=v;buildPorts();portsEl.hidden=false};
hdrQ.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const b=document.querySelector("#portList button[data-p]");if(b)b.click()}
  else if(e.key==="Escape"){hdrQ.value="";portsEl.hidden=true}};
portQ.addEventListener("input",()=>{hdrQ.value=portQ.value});
document.addEventListener("keydown",e=>{if(e.key==="Escape")portsEl.hidden=true});
window.addEventListener("message",e=>{const m=e.data;if(!m||m.type!=="streamlit:render")return;
  loadEl.hidden=true;loadEl.textContent="물때 불러오는 중…";const nd=m.args&&m.args.data;
  if(!nd||!nd.days||!Object.keys(nd.days).length){document.querySelector(".app").innerHTML='<div style="padding:24px">물때 자료를 불러오지 못했습니다.</div>';setHeight();return}
  setData(nd);render();try{nmListUI();if(MAPMODE==="port"&&MAPPORT!==D.portFull&&!document.getElementById("nearMap").hidden)showPortMap()}catch(e){}setHeight()});
new ResizeObserver(setHeight).observe(document.body);
send("streamlit:componentReady",{apiVersion:1});
})();
</script>
</body></html>
