name: 빠른 확인 (스크립트 하나 실행 → probe-log)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "실행할 파이썬 파일 (저장소 경로)"
        required: true
        default: "store/data/horizon_probe.py"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 korean-lunar-calendar
      - run: python "${{ github.event.inputs.script }}" out
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 결과를 probe-log 브랜치에
        if: always()
        run: |
          mkdir -p out && cd out && git init -q && git config user.name probe-bot && git config user.email probe-bot@users.noreply.github.com
          git checkout -q -b probe-log && git add -A && git commit -q -m "빠른 확인" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-log
