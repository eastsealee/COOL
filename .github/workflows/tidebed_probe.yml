name: 자체 물때 시험 (TideBED 상수 + 기준항 → 항구 물때 정확도)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python store/data/tidebed_probe.py out
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 결과를 probe-log 브랜치에
        if: always()
        run: |
          cd out && git init -q && git config user.name tb-bot && git config user.email tb-bot@users.noreply.github.com
          git checkout -q -b probe-log && git add -A && git commit -q -m "자체 물때 시험" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-log
