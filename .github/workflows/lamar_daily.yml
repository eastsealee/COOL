name: 라마르 조과 매일 갱신

on:
  schedule:
    - cron: "0 15 * * *"     # 매일 한국시간 자정(오전 0시) — GitHub 시간은 UTC라 15시로 적음
  workflow_dispatch:         # Actions 탭에서 [Run workflow]로 바로 실행 가능
    inputs:
      start_date:
        description: "예상 시작일 (예: 2026-10-25) · 비우면 오늘부터"
        required: false
        default: ""
      days:
        description: "며칠치 예상"
        required: false
        default: "7"

permissions:
  contents: write

concurrency:
  group: lamar-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests beautifulsoup4 lxml korean-lunar-calendar

      - name: 블로그 새 조과 글 가져와 분석
        run: python lamar/lamar_update.py --days 10

      - name: 지정한 날(비우면 오늘)부터 7일 예상 저장
        run: python lamar/lamar_forecast.py --days "${{ github.event.inputs.days || '7' }}" --start "${{ github.event.inputs.start_date }}"

      - name: 바뀐 데이터 저장 (main 브랜치)
        run: |
          git add -N lamar/data/lamar_forecasts.json 2>/dev/null || true
          if git diff --quiet -- lamar/data/lamar_days.json lamar/data/lamar_forecasts.json; then
            echo "바뀐 내용 없음"
            exit 0
          fi
          git config user.name "lamar-bot"
          git config user.email "lamar-bot@users.noreply.github.com"
          git add lamar/data/lamar_days.json lamar/data/lamar_forecasts.json
          git commit -m "라마르 조과 데이터 자동 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
