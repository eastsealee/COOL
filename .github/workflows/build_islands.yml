name: 섬 이름 자료 만들기 (물때 시계 지도 이름표)

on:
  workflow_dispatch:
  schedule:
    - cron: "20 19 1 * *"     # 매달 2일 한국시간 04:20 (새로 등록된 섬 이름 반영)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python mulddae/build_islands.py
      - name: 바뀌었으면 저장
        run: |
          git config user.name islands-bot && git config user.email islands-bot@users.noreply.github.com
          git add mulddae/dial_component/islands.json
          if ! git diff --cached --quiet; then git commit -m "섬 이름 자료 갱신" && git pull --rebase origin main && git push origin HEAD:main; fi
