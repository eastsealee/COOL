name: 쭈갑과물때 안드로이드 앱 만들기

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build_android.yml"]
  workflow_dispatch:         # Actions 탭에서 [Run workflow]로 다시 만들 수 있음

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK 만들기
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee ../build.log

      - name: 실패하면 기록을 android-log 브랜치에 저장 (원인 확인용)
        if: failure()
        run: |
          mkdir -p /tmp/alog && cp build.log /tmp/alog/ 2>/dev/null || echo "no log" > /tmp/alog/build.log
          cd /tmp/alog && git init -q && git config user.name "android-bot" && git config user.email "android-bot@users.noreply.github.com"
          git checkout -q -b android-log && git add -A && git commit -q -m "android build log"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-log

      - name: 다운로드 링크(Releases)에 올리기 — 항상 같은 주소
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk mulddae-clock.apk
          gh release delete android-latest --yes --cleanup-tag || true
          # 예전에 초안으로 남은 릴리스 정리
          gh api repos/${{ github.repository }}/releases --jq '.[] | select(.draft) | .id' | xargs -r -I{} gh api -X DELETE repos/${{ github.repository }}/releases/{} || true
          gh release create android-latest mulddae-clock.apk \
            --title "쭈갑과물때 앱 (최신)" \
            --notes "빌드 #${GITHUB_RUN_NUMBER} · $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          변경: $(git log -1 --format=%s)
          (앱이 이 '빌드 #번호'를 읽어 새 버전 알림을 띄웁니다)" \
            --latest
          # 가끔 초안(draft)으로 남는 경우가 있어 확실히 공개로 바꿔 둠 (그래야 다운로드 주소가 열림)
          gh release edit android-latest --draft=false --latest
