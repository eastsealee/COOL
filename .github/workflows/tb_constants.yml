name: 자체 물때 상수 받기 (해양조사원 TideBED, 전국 항구)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 17 5 * *"     # 매달 6일 한국시간 02:30

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python store/data/tb_constants.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 바뀌었으면 저장
        run: |
          git config user.name tb-bot && git config user.email tb-bot@users.noreply.github.com
          git add store/data/tb_constants.json
          if ! git diff --cached --quiet; then git commit -m "자체 물때 상수 갱신" && git pull --rebase origin main && git push origin HEAD:main; fi
